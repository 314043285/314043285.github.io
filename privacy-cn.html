<h1>隐私政策 - JNBMS</h1>
<p>更新日期：2026-10-23</p >

<p> JNBMS 是用于电池管理系统的本地蓝牙调试工具。</p >
<p>本应用<strong>不会收集、存储、上传、分享任何用户个人信息</strong>。</p >
<p>所有电池数据（电压、电流、温度、设备参数、告警信息等）仅保存在您的手机本地，不会上传至任何远程服务器。</p >
<p>App仅通过蓝牙和您本地的BMS硬件进行通信。</p >
<p>我们不会获取您的位置、通讯录、照片、相机、设备标识等任何个人隐私信息。</p >
